<!doctype html>
<html lang="uz" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff8f0" />
    <meta name="color-scheme" content="light" />
    <title>Mikrodars taqdimoti</title>
    <link rel="icon" href="/brand/logo.svg" />
  </head>
  <body>
    <!-- The page is a fixed stage over the background (an exercise-book page or a chalkboard).
         main.js fills every part from src/. -->
    <div id="bg" aria-hidden="true"></div>
    <div id="shade" aria-hidden="true"></div>

    <header class="top">
      <div class="mark" id="mark"></div>
      <div class="ctl" id="ctl" data-ui></div>
      <div class="count" id="count" aria-live="polite"></div>
    </header>

    <main id="stage" data-layout="hero">
      <section id="card-slot" aria-live="polite"></section>
      <section id="visual-slot" aria-hidden="true"></section>
    </main>

    <nav id="rail"></nav>
    <div class="cue" id="cue"></div>
    <footer class="credits" id="credits"></footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
